name: Borg Integration

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  borg-integration:
    name: Borg Integration Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25.5"

      # ubuntu-24.04's apt archive carries borgbackup 1.2.x (1.2.7 as of this
      # writing), which satisfies the adapter's >= 1.2 floor.
      - name: Install borg
        run: |
          sudo apt-get update
          sudo apt-get install -y borgbackup

      - name: Verify borg
        run: |
          borg --version

      - name: go test -tags borg_integration
        env:
          CGO_ENABLED: 0
        run: |
          go test -tags borg_integration -count=1 ./internal/borg/...

      - name: go test -race -tags borg_integration
        env:
          CGO_ENABLED: 1
        run: |
          go test -race -tags borg_integration -count=1 ./internal/borg/...
